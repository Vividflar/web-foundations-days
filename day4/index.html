<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Live Character Counter</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>QuickNotes</h1>
            <p>Live character counter</p>
            <button type="button" id="theme-toggle">Dark mode</button>
        </header>

        <main>
            <section>
                <label for="note-text">Write your note</label>
                <textarea id="note-text" rows="6" placeholder="Start typing..."></textarea>
                <p id="char-count">0 / 200 characters</p>
                <p id="word-count">0 words</p>
                <button type="button" id="clear-btn">Clear</button>
            </section>
        </main>
    </body>
</html>
