<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Directory</title>
        <script src="users.js" defer></script>
        <style>
            body {
                max-width: 700px;
                margin: 24px auto;
                padding: 0 16px;
                font-family: "Segoe UI", Arial, sans-serif;
                line-height: 1.5;
            }
            #users-list {
                padding: 0;
                list-style: none;
            }
            #users-list li {
                margin-bottom: 12px;
                padding: 12px 16px;
                border: 1px solid #ccc;
                border-radius: 8px;
            }
            #users-list p {
                margin: 0;
            }
            .user-name {
                font-weight: bold;
            }
            #status.error {
                color: #c0392b;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>User Directory</h1>
 
        <button type="button" id="load-users">Load users</button>
 
        <p>
            <label for="filter-input">Filter by name</label>
            <input type="text" id="filter-input" placeholder="Type a name..." />
        </p>
 
        <p id="status"></p>
        <ul id="users-list"></ul>
    </body>
</html>
